name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --run
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm version:status
      - run: pnpm audit --prod --registry=https://registry.npmjs.org
